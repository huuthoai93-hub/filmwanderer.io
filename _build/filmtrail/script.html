<script>
// Language menu: close on Escape and on a click outside, like a native menu.
(function () {
  var menu = document.querySelector("details.lang");
  if (!menu) return;
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && menu.open) { menu.open = false; menu.querySelector("summary").focus(); }
  });
  document.addEventListener("click", function (e) {
    if (menu.open && !menu.contains(e.target)) menu.open = false;
  });
})();

// Policy contents: on phones the list starts closed; on wide screens it is always open and marks the clause being read.
(function () {
  var toc = document.querySelector(".toc-d");
  if (!toc) return;
  var wide = window.matchMedia("(min-width: 821px)");
  var sync = function () { toc.open = wide.matches; };
  sync();
  if (wide.addEventListener) wide.addEventListener("change", sync);
  toc.querySelector("summary").addEventListener("click", function (e) { if (wide.matches) e.preventDefault(); });
  document.querySelectorAll('.to-toc').forEach(function (a) { a.addEventListener("click", function () { if (!wide.matches) toc.open = true; }); });
  if (!("IntersectionObserver" in window)) return;
  var links = {};
  toc.querySelectorAll("a[href^='#']").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      Object.keys(links).forEach(function (id) { links[id].removeAttribute("aria-current"); });
      var a = links[e.target.id];
      if (a) a.setAttribute("aria-current", "location");
    });
  }, { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll(".clause[id]").forEach(function (el) { io.observe(el); });
})();

// Film advance: the sprocket rails creep while the strip is on screen, like film pulled through a camera.
(function () {
  var strip = document.querySelector(".strip");
  if (!strip || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ticking = false, visible = false;
  new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(strip);
  window.addEventListener("scroll", function () {
    if (!visible || ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      strip.style.setProperty("--adv", ((window.scrollY * 0.35) % 48).toFixed(1) + "px");
      ticking = false;
    });
  }, { passive: true });
})();
</script>
