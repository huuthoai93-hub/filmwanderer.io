<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:H;src:url("../assets/fonts/jetbrains_mono_extrabold.ttf")}
body{margin:0;width:1200px;height:630px;background:#F4E8C1;font-family:ui-monospace,Menlo,monospace;color:#1A1A1A;overflow:hidden;position:relative}
.strip{position:absolute;left:0;right:0;bottom:0;height:150px;background:#1A1A1A}
.holes{position:absolute;left:0;right:0;height:14px;background-image:repeating-linear-gradient(to right,transparent 0 16px,#F4E8C1 16px 36px,transparent 36px 50px)}
.h1{top:14px}.h2{bottom:14px}
.edge{position:absolute;left:40px;top:62px;color:#FFB800;font:700 18px ui-monospace,monospace;letter-spacing:.25em}
.frames{position:absolute;right:40px;top:40px;display:flex;gap:12px}
.frames i{display:block;width:96px;height:70px;border:2px solid #F4E8C1}
.frames i:first-child{background:#FFB800;border-color:#FFB800}
.logo{position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:16px;font:800 34px H}
.can{width:40px;height:40px;background:#FFB800;border:3px solid #1A1A1A;position:relative}.can:after{content:"";position:absolute;inset:8px 12px;background:#1A1A1A}
h1{position:absolute;left:64px;top:120px;margin:0;font:800 96px/1.08 H}
h1 span{background:#FFB800;padding:0 10px}
p{position:absolute;left:64px;top:360px;margin:0;font-size:26px}
.badge{position:absolute;right:64px;top:64px;border:3px solid #1A1A1A;padding:10px 16px;font-weight:700;font-size:18px;letter-spacing:.12em;box-shadow:5px 5px 0 #1A1A1A;background:#FFB800}
</style></head><body>
<div class="logo"><span class="can"></span>FILMDESK</div>
<div class="badge">COMING SOON · GOOGLE PLAY</div>
<h1>Every roll,<br><span>logged.</span></h1>
<p>A logbook for film photographers · Android</p>
<div class="strip"><div class="holes h1"></div><div class="edge">FILMDESK 400 ▸ 1 ▸ 1A</div><div class="frames"><i></i><i></i><i></i><i></i><i></i></div><div class="holes h2"></div></div>
</body></html>
