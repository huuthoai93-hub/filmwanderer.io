<script>
// Language menu: close on Escape and on a click outside, like a native menu.
(function () {
  var menu = document.querySelector("details.lang");
  if (!menu) return;
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && menu.open) { menu.open = false; menu.querySelector("summary").focus(); }
  });
  document.addEventListener("click", function (e) {
    if (menu.open && !menu.contains(e.target)) menu.open = false;
  });
})();

// (FilmTrail has no screenshots yet, so the "develop" effect has nothing to act on.)
(function () {
  var shots = document.querySelectorAll(".shot");
  var develop = function (el) { el.classList.add("dev"); };
  if (!("IntersectionObserver" in window)) { shots.forEach(develop); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { develop(e.target); io.unobserve(e.target); }
    });
  }, { threshold: 0.45 });
  shots.forEach(function (el) { io.observe(el); });
})();

// Film advance: the sprocket rails creep while the strip is on screen, like film pulled through a camera.
(function () {
  var strip = document.querySelector(".strip");
  if (!strip || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var ticking = false, visible = false;
  new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(strip);
  window.addEventListener("scroll", function () {
    if (!visible || ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      strip.style.setProperty("--adv", ((window.scrollY * 0.35) % 48).toFixed(1) + "px");
      ticking = false;
    });
  }, { passive: true });
})();
</script>
